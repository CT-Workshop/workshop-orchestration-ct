services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cos
      POSTGRES_PASSWORD: cos
      POSTGRES_DB: closing_orchestration
    ports:
      - "5432:5432"
    volumes:
      - cos_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  cos_pg_data:
